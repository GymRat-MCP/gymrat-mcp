name: CI & Deploy

# dev 브랜치 머지(push) 시: 테스트 통과 → Lightsail 자동 배포.
# PR(대상 dev) 시: 테스트만 실행(배포 안 함).
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# 동시 배포 충돌 방지: 같은 브랜치의 이전 실행은 취소
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -q

  deploy:
    name: Deploy to Lightsail
    needs: test                                   # 테스트 통과가 게이트
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: SSH → git pull + docker compose up
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          script_stop: true                       # 한 줄이라도 실패하면 중단
          script: |
            set -e
            cd ~/gymrat-mcp
            git fetch --all --prune
            git checkout dev
            git reset --hard origin/dev            # 서버 로컬 변경 무시하고 dev에 정렬
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f                  # 빌드 후 떠도는 dangling 이미지 정리
