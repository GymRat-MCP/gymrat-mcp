# Alembic 설정. DB URL은 alembic/env.py에서 앱(db.session)의 DATABASE_URL을
# 그대로 읽어오므로 여기에 sqlalchemy.url을 하드코딩하지 않는다(단일 소스).
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# 마이그레이션 파일명: 0001_slug.py 형태(정렬 가능한 순번 + 설명)
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
