services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gymrat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://user:password@db:5432/gymrat
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
